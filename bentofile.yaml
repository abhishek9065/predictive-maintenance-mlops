service: "service:PredictiveMaintenanceService"
description: "Predictive Maintenance ML Service - BentoML Production Deployment"
labels:
  owner: mlops-team
  project: predictive-maintenance
  stage: production
  version: "2.0.0"
include:
  - "service.py"
  - "models/"
python:
  packages:
    - scikit-learn==1.3.2
    - pandas==2.1.4
    - numpy==1.26.2
    - joblib==1.3.2
    - pydantic==2.5.0
docker:
  distro: debian
  python_version: "3.11"
  system_packages:
    - git
    - curl
  setup_script: |
    # Install additional system dependencies
    apt-get update && apt-get install -y --no-install-recommends \
        build-essential \
        && rm -rf /var/lib/apt/lists/*

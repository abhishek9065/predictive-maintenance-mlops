apiVersion: kubeflow.org/v1beta1
kind: Experiment
metadata:
  name: predictive-maintenance-tuning
  namespace: kubeflow
spec:
  objective:
    type: maximize
    goal: 0.99
    objectiveMetricName: accuracy
    additionalMetricNames:
      - precision
      - recall
      - f1_score
  
  algorithm:
    algorithmName: random
    # Alternative algorithms:
    # - grid
    # - bayesianoptimization
    # - hyperband
    # - tpe (Tree-structured Parzen Estimator)
  
  parallelTrialCount: 3
  maxTrialCount: 20
  maxFailedTrialCount: 3
  
  parameters:
    # Random Forest parameters
    - name: n_estimators
      parameterType: int
      feasibleSpace:
        min: "50"
        max: "200"
        step: "10"
    
    - name: max_depth
      parameterType: int
      feasibleSpace:
        min: "5"
        max: "30"
        step: "5"
    
    - name: min_samples_split
      parameterType: int
      feasibleSpace:
        min: "2"
        max: "10"
    
    - name: min_samples_leaf
      parameterType: int
      feasibleSpace:
        min: "1"
        max: "5"
  
  trialTemplate:
    primaryContainerName: training-container
    trialSpec:
      apiVersion: batch/v1
      kind: Job
      spec:
        template:
          metadata:
            annotations:
              sidecar.istio.io/inject: "false"
          spec:
            containers:
              - name: training-container
                image: mlops-predictive-maintenance:latest
                command:
                  - python
                  - katib_tuning.py
                  - --model=random_forest
                  - --n_estimators=${trialParameters.nEstimators}
                  - --max_depth=${trialParameters.maxDepth}
                  - --min_samples_split=${trialParameters.minSamplesSplit}
                  - --min_samples_leaf=${trialParameters.minSamplesLeaf}
                volumeMounts:
                  - name: data-volume
                    mountPath: /app/data
                  - name: models-volume
                    mountPath: /app/models
            
            volumes:
              - name: data-volume
                persistentVolumeClaim:
                  claimName: mlops-data-pvc
              - name: models-volume
                persistentVolumeClaim:
                  claimName: mlops-models-pvc
            
            restartPolicy: Never

---
# Alternative experiment for Gradient Boosting
apiVersion: kubeflow.org/v1beta1
kind: Experiment
metadata:
  name: gradient-boosting-tuning
  namespace: kubeflow
spec:
  objective:
    type: maximize
    goal: 0.99
    objectiveMetricName: accuracy
  
  algorithm:
    algorithmName: bayesianoptimization
    algorithmSettings:
      - name: random_state
        value: "42"
      - name: n_initial_points
        value: "5"
  
  parallelTrialCount: 2
  maxTrialCount: 15
  
  parameters:
    - name: n_estimators
      parameterType: int
      feasibleSpace:
        min: "50"
        max: "150"
    
    - name: max_depth
      parameterType: int
      feasibleSpace:
        min: "3"
        max: "10"
    
    - name: learning_rate
      parameterType: double
      feasibleSpace:
        min: "0.01"
        max: "0.3"
    
    - name: min_samples_split
      parameterType: int
      feasibleSpace:
        min: "2"
        max: "8"
  
  trialTemplate:
    primaryContainerName: training-container
    trialSpec:
      apiVersion: batch/v1
      kind: Job
      spec:
        template:
          spec:
            containers:
              - name: training-container
                image: mlops-predictive-maintenance:latest
                command:
                  - python
                  - katib_tuning.py
                  - --model=gradient_boosting
                  - --n_estimators=${trialParameters.nEstimators}
                  - --max_depth=${trialParameters.maxDepth}
                  - --learning_rate=${trialParameters.learningRate}
                  - --min_samples_split=${trialParameters.minSamplesSplit}
            restartPolicy: Never

---
# Logistic Regression experiment
apiVersion: kubeflow.org/v1beta1
kind: Experiment
metadata:
  name: logistic-regression-tuning
  namespace: kubeflow
spec:
  objective:
    type: maximize
    goal: 0.99
    objectiveMetricName: accuracy
  
  algorithm:
    algorithmName: grid
  
  parallelTrialCount: 4
  maxTrialCount: 24
  
  parameters:
    - name: C
      parameterType: double
      feasibleSpace:
        min: "0.01"
        max: "10.0"
        list:
          - "0.01"
          - "0.1"
          - "1.0"
          - "10.0"
    
    - name: max_iter
      parameterType: categorical
      feasibleSpace:
        list:
          - "500"
          - "1000"
          - "2000"
    
    - name: penalty
      parameterType: categorical
      feasibleSpace:
        list:
          - "l1"
          - "l2"
  
  trialTemplate:
    primaryContainerName: training-container
    trialSpec:
      apiVersion: batch/v1
      kind: Job
      spec:
        template:
          spec:
            containers:
              - name: training-container
                image: mlops-predictive-maintenance:latest
                command:
                  - python
                  - katib_tuning.py
                  - --model=logistic_regression
                  - --C=${trialParameters.C}
                  - --max_iter=${trialParameters.maxIter}
                  - --penalty=${trialParameters.penalty}
            restartPolicy: Never

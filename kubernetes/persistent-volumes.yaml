---
# Persistent Volume for Data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mlops-data-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /data/mlops/data
    type: DirectoryOrCreate

---
# Persistent Volume Claim for Data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlops-data-pvc
  namespace: kubeflow
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

